services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-replace-me}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-replace-me}
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/keycloak-results-export.json:/opt/keycloak/data/import/keycloak-results-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
      openldap:
        condition: service_healthy
  openldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bionicpro.ldif:ro
    ports:
      - "1389:389"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://localhost:389 -D cn=admin,dc=example,dc=com -w admin -b dc=example,dc=com -s base '(objectClass=*)' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  profiles_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bionicpro_profiles
      POSTGRES_USER: bionicpro
      POSTGRES_PASSWORD: bionicpro
    volumes:
      - profiles-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bionicpro -d bionicpro_profiles"]
      interval: 5s
      timeout: 5s
      retries: 10
  crm_db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    volumes:
      - crm-data:/var/lib/postgresql/data
      - ./data/crm/init.sql:/docker-entrypoint-initdb.d/01_crm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10
  crm-cdc-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: crm
    volumes:
      - ./data/crm/cdc-init.sql:/cdc-init.sql:ro
    command:
      - psql
      - -h
      - crm_db
      - -U
      - crm
      - -d
      - crm
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /cdc-init.sql
    depends_on:
      crm_db:
        condition: service_healthy
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  debezium:
    image: quay.io/debezium/connect:3.3
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-debezium
      CONFIG_STORAGE_TOPIC: bionicpro_connect_configs
      OFFSET_STORAGE_TOPIC: bionicpro_connect_offsets
      STATUS_STORAGE_TOPIC: bionicpro_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    ports:
      - "8084:8083"
    depends_on:
      kafka:
        condition: service_healthy
      crm-cdc-init:
        condition: service_completed_successfully
  debezium-init:
    image: curlimages/curl:8.17.0
    volumes:
      - ./debezium/crm-postgres-connector.json:/connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until curl -fsS http://debezium:8083/connectors >/dev/null; do sleep 2; done;
        curl -fsS -X PUT http://debezium:8083/connectors/crm-postgres-connector/config
        -H 'Content-Type: application/json'
        --data-binary @/connector.json
    depends_on:
      debezium:
        condition: service_started
  telemetry_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    volumes:
      - telemetry-data:/var/lib/postgresql/data
      - ./data/telemetry/init.sql:/docker-entrypoint-initdb.d/01_telemetry.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10
  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: bionicpro
      CLICKHOUSE_PASSWORD: bionicpro
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/01_reports.sql:ro
      - ./clickhouse/cdc.sql:/docker-entrypoint-initdb.d/02_cdc.sql:ro
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user bionicpro --password bionicpro --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      kafka:
        condition: service_healthy
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bionicpro
      MINIO_ROOT_PASSWORD: bionicpro-secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 bionicpro bionicpro-secret; do sleep 1; done;
      mc mb --ignore-existing local/reports;
      mc anonymous set download local/reports;
      "
  cdn:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - cdn-cache:/var/cache/nginx/reports
    ports:
      - "8083:8080"
    depends_on:
      minio-init:
        condition: service_completed_successfully
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      TELEMETRY_DATABASE_URL: postgresql://telemetry:telemetry@telemetry_db:5432/telemetry
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: bionicpro
      CLICKHOUSE_PASSWORD: bionicpro
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
    ports:
      - "8082:8080"
    depends_on:
      telemetry_db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      LISTEN_ADDRESS: ":8081"
      CLICKHOUSE_URL: http://clickhouse:8123/?database=reports
      CLICKHOUSE_USER: bionicpro
      CLICKHOUSE_PASSWORD: bionicpro
      KEYCLOAK_ISSUER: http://localhost:8080/realms/reports-realm
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      EXPECTED_AUDIENCE: reports-api
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: bionicpro
      S3_SECRET_KEY: bionicpro-secret
      S3_BUCKET: reports
      S3_SECURE: "false"
      CDN_BASE_URL: http://localhost:8083
      OBJECT_KEY_SECRET: local-report-object-key
    depends_on:
      clickhouse:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      LISTEN_ADDRESS: ":8000"
      INTERNAL_LISTEN_ADDRESS: ":8001"
      PUBLIC_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret
      REDIS_ADDRESS: redis:6379
      PROFILE_DATABASE_URL: postgres://bionicpro:bionicpro@profiles_db:5432/bionicpro_profiles?sslmode=disable
      API_BASE_URL: http://reports-api:8081
      YANDEX_USERINFO_URL: https://login.yandex.ru/info?format=json
      TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      COOKIE_SECURE: "true"
      LOGIN_TTL: 5m
      SESSION_IDLE_TTL: 30m
      SESSION_MAX_TTL: 8h
      ACCESS_TOKEN_REFRESH_SKEW: 15s
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      profiles_db:
        condition: service_healthy
      reports-api:
        condition: service_started
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - bionicpro-auth

volumes:
  redis-data:
  profiles-data:
  crm-data:
  telemetry-data:
  clickhouse-data:
  airflow-data:
  minio-data:
  cdn-cache:
  kafka-data:
